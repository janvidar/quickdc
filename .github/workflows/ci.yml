#
## Continuous integration for QuickDC
##
## Lives in .github/workflows because Gitea Actions reads that path as well as
## its own, so one file serves both remotes.
##
## Every job configures with QUICKDC_REQUIRE_AUTOTESTS=ON. Without it an absent
## exotic submodule drops the whole autotest suite and ctest still reports every
## remaining test green, so a run that skipped it looks exactly like one that did
## not - see core/test/autotests/CMakeLists.txt.
##
## exotic itself needs no step of its own: it is a submodule inside samurai, the
## top level adds it to the build, and MODE AUTO compiles the .tcc files against
## the library rather than running the generator. The checkouts below are
## recursive for that reason.
#

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The configuration a user gets: RelWithDebInfo, tracing off, hardened.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      # samurai is a submodule, and it carries exotic as one of its own, so the
      # checkout has to be recursive or the autotest suite is skipped.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libbz2-dev libssl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja openssl@3


      # The system OpenSSL on macOS is a LibreSSL too old for the 3.5 floor
      # samurai enforces, so point CMake at the keg-only one.
      - name: Configure
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          fi
          cmake -S . -B build -G Ninja -DQUICKDC_REQUIRE_AUTOTESTS=ON

      # The tree is warning-free in every configuration, and the curated -Werror
      # set deliberately does not cover everything - so the way to keep it that
      # way is to fail on any warning here rather than widen -Werror and trip
      # over -Wunused-parameter in the event handler stubs.
      - name: Build
        run: |
          set -o pipefail
          cmake --build build 2>&1 | tee build.log
          if grep -q 'warning:' build.log; then
            echo "::error::build produced warnings"
            grep 'warning:' build.log
            exit 1
          fi

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # AddressSanitizer and UndefinedBehaviorSanitizer.
  #
  # This is the job that earns its place: it is what caught the empty-acl.xml
  # null reference, the hub deleting a user while its socket was still
  # registered, and every out-of-bounds read in the NMDC parsers.
  # ---------------------------------------------------------------------------
  sanitizers:
    name: sanitizers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libbz2-dev libssl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja openssl@3


      - name: Configure
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          fi
          cmake -S . -B build-asan -G Ninja \
                -DQUICKDC_SANITIZE=ON \
                -DQUICKDC_REQUIRE_AUTOTESTS=ON

      - name: Build
        run: cmake --build build-asan

      # Leaks are off here on purpose. There are known open ones - a per-INF
      # copy the hub never frees, and a TimeStamp per hub connection - so
      # LeakSanitizer would fail this job for faults nobody is fixing in the
      # same change. The 'leaks' job below reports them without gating.
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  # ---------------------------------------------------------------------------
  # The tracing build is a different set of code, not a different flag: it is
  # the only configuration that compiles core/debug/dbg.cpp and the ~450 QDBG
  # call sites the printf format attribute checks. Keeping it building is what
  # stops a format bug reaching a developer's machine only.
  # ---------------------------------------------------------------------------
  tracing:
    name: tracing build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libbz2-dev libssl-dev


      - name: Configure, build and test with tracing on
        run: |
          set -o pipefail
          cmake -S . -B build-trace -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DQUICKDC_TRACE=ON \
                -DQUICKDC_REQUIRE_AUTOTESTS=ON
          cmake --build build-trace 2>&1 | tee build-trace.log
          if grep -q 'warning:' build-trace.log; then
            echo "::error::tracing build produced warnings"
            grep 'warning:' build-trace.log
            exit 1
          fi
          ctest --test-dir build-trace --output-on-failure

  # ---------------------------------------------------------------------------
  # samurai's own suite, which a QuickDC build never runs: the top level sets
  # SAMURAI_BUILD_TESTS OFF. The submodule is pinned, so a bump that breaks the
  # library it supplies should be visible here rather than in QuickDC's tests.
  # ---------------------------------------------------------------------------
  samurai:
    name: samurai suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libbz2-dev libssl-dev

      - name: Configure, build and test samurai standalone
        run: |
          cmake -S samurai -B build-samurai -G Ninja
          cmake --build build-samurai
          ctest --test-dir build-samurai --output-on-failure

  # ---------------------------------------------------------------------------
  # Non-blocking: reports what LeakSanitizer finds without failing the run.
  #
  # LSan does not exist on Darwin, so this is Linux only - which is the whole
  # reason the leak findings in the audit were never measured.
  # ---------------------------------------------------------------------------
  leaks:
    name: leaks (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libbz2-dev libssl-dev


      - name: Configure and build
        run: |
          cmake -S . -B build-leaks -G Ninja \
                -DQUICKDC_SANITIZE=ON \
                -DQUICKDC_REQUIRE_AUTOTESTS=ON
          cmake --build build-leaks

      - name: Report leaks
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-leaks --output-on-failure
